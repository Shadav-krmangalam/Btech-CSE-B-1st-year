<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST</title>
</head>
<body>
    <!-- unordered List -->

    <ul type="square">
        <li>Home Page</li>
        <li>About Page</li>
        <li>Contact Page</li>
    </ul>

    <!-- Ordered List -->

    <ol type="I">
        <li>Home Page</li>
        <li>About Page</li>
        <li>Contact Page</li>
    </ol>

    <!-- Description List -->
     <dl>
         <dt>HTML</dt>
         <dd>This is a structural Language for websites</dd>

         <dt>CSS</dt>
         <dd>This is Styling Language</dd>
     </dl>

</body>
</html>
